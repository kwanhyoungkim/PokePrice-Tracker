services:
  cards-db:
    image: postgres:16-alpine
    container_name: pokeprice-cards-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokeprice}
      POSTGRES_USER: ${POSTGRES_USER:-pokeprice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokeprice}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pokeprice_cards_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokeprice} -d ${POSTGRES_DB:-pokeprice}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pokeprice_cards_db_data:
